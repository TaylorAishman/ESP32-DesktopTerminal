[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
# Pinned so every machine builds against the same SDK. Change deliberately.
ESP_IDF_VERSION = "v5.5.3"
# The workspace is virtual; tell esp-idf-sys which crate is the binary so it
# finds the C HAL component declared by its dependency dt-hal.
ESP_IDF_SYS_ROOT_CRATE = "dt-firmware"
