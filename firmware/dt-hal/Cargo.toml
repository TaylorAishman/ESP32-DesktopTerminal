[package]
name = "dt-hal"
description = "Safe Rust wrappers around the C hardware abstraction layer. The only crate allowed to use unsafe."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
esp-idf-sys.workspace = true

# Build the C HAL as an ESP-IDF component and generate its bindings into
# `esp_idf_sys::dt_hal`. esp-idf-sys reads this from direct dependencies of the
# binary, so dt-firmware must depend on dt-hal directly.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = "../../hal"
bindings_header = "../../hal/dt_hal/include/hal.h"
bindings_module = "dt_hal"
