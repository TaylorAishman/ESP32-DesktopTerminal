# Wi-Fi credentials and API keys.
#
# Copy this file to config/secrets.toml and fill it in. config/secrets.toml
# is git-ignored and hidden from AI coding tools; never commit it. The build
# refuses to run while any value below is still a placeholder.
#
# Note: these values are compiled into the firmware and are readable by
# anyone with physical access to the device (Requirements OQ-7).

[wifi]
# 2.4 GHz network; WPA2/WPA3-Personal.
ssid = "YOUR_WIFI_NAME"
password = "YOUR_WIFI_PASSWORD"

# One key per provider in config/api.toml.
[api_keys]
# https://home.openweathermap.org/api_keys
openweathermap = "PASTE_OPENWEATHERMAP_KEY_HERE"
# https://newsapi.org/account
newsapi = "PASTE_NEWSAPI_KEY_HERE"
# https://finnhub.io/dashboard
finnhub = "PASTE_FINNHUB_KEY_HERE"
