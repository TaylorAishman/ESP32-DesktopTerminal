[workspace]
resolver = "2"
members = [
    "crates/dt-config",
    "crates/dt-core",
    "crates/dt-ui",
    "crates/dt-sim",
]
# The device crates live in their own workspace with the esp toolchain.
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"
publish = false

[workspace.dependencies]
dt-config = { path = "crates/dt-config" }
dt-core = { path = "crates/dt-core" }
dt-ui = { path = "crates/dt-ui" }
embedded-graphics = "0.8.2"
log = "0.4"
png = "0.18"
u8g2-fonts = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
